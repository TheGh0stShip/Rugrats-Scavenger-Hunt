name: progress

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  decomp-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_decomp_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: NRGE_report
          path: build/report.json
          if-no-files-found: error
      # Preserve the established ByteMatch version key.
      - uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: build/report.json
          if-no-files-found: error
      - name: Upload report to decmp.dev
        run: |
          curl -fsSL https://api.decmp.dev/action/v1.1.0.mjs -o decmp.mjs
          echo "10fb0039a067b4ffe67510959356a691efa6efbb0aae16450c04f8c64da0a5f8  decmp.mjs" | sha256sum -c
          node decmp.mjs
        env:
          DECMP_REPORT: build/report.json
          DECMP_VERSION: NRGE
          DECMP_NAME: "Rugrats: Scavenger Hunt"
          DECMP_PLATFORM: n64
          GITHUB_TOKEN: ${{ github.token }}
